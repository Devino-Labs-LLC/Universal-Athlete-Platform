name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  # Test jobs upload coverage artifacts; the Sonar job downloads them.
  # This does not authorize repository contents writes.
  actions: write

jobs:
  backend-tests:
    name: Backend ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [core, training-app, training-http]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Backend tests (${{ matrix.shard }})
        working-directory: backend/uap-server
        run: |
          case "${{ matrix.shard }}" in
            core)
              ./gradlew test --no-daemon --console=plain \
                --tests 'com.devinolabs.uap.UapServerApplicationTests' \
                --tests 'com.devinolabs.uap.ModularityTests' \
                --tests 'com.devinolabs.uap.identity.*' \
                --tests 'com.devinolabs.uap.athlete.*' \
                --tests 'com.devinolabs.uap.training.domain.*'
              ;;
            training-app)
              ./gradlew test --no-daemon --console=plain \
                --tests 'com.devinolabs.uap.training.application.*'
              ;;
            training-http)
              ./gradlew test --no-daemon --console=plain \
                --tests 'com.devinolabs.uap.training.infrastructure.*'
              ;;
            *)
              echo "Unknown backend shard: ${{ matrix.shard }}"
              exit 1
              ;;
          esac
      - name: Upload JaCoCo execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-${{ matrix.shard }}
          path: backend/uap-server/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: backend-tests
    if: always()
    steps:
      - name: Require backend shards
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend shards did not all succeed: ${{ needs.backend-tests.result }}"
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck
      - run: pnpm web:lint
      - run: pnpm web:test:coverage
      - name: Upload web LCOV
        uses: actions/upload-artifact@v4
        with:
          name: web-lcov
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      - name: Web production-shaped build
        env:
          VITE_UAP_ENV: production
          VITE_UAP_API_BASE_URL: https://api.example.com
        run: pnpm web:build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:typecheck
      - run: pnpm mobile:lint
      - run: pnpm mobile:test:coverage
      - name: Upload mobile LCOV
        uses: actions/upload-artifact@v4
        with:
          name: mobile-lcov
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # Canonical analysis. Automatic Analysis must stay disabled
  # (Project Administration → Analysis Method). Skip Sonar JRE download and use
  # the Temurin 21 already installed on the runner.
  sonar:
    name: Sonar quality gate
    # Trusted same-repository pushes and PRs only. Fork PRs do not receive
    # SONAR_TOKEN and must not run scanner or compute-engine inspection.
    # Do not use pull_request_target.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    needs: [backend, web, mobile]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Record runner Java 21 for Sonar
        id: sonar-java
        run: |
          echo "java_home=${JAVA_HOME}" >> "$GITHUB_OUTPUT"
          "${JAVA_HOME}/bin/java" -version
      - name: Install JavaScript dependencies for TypeScript analysis
        run: pnpm install --frozen-lockfile
      - name: Download backend JaCoCo execution data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-exec-*
          path: backend/uap-server/build/jacoco-shards
      - name: Download web LCOV
        uses: actions/download-artifact@v4
        with:
          name: web-lcov
          path: apps/web/coverage
      - name: Download mobile LCOV
        uses: actions/download-artifact@v4
        with:
          name: mobile-lcov
          path: apps/mobile/coverage
      - name: Map LCOV paths to the repository root
        run: |
          test -f apps/web/coverage/lcov.info
          test -f apps/mobile/coverage/lcov.info
          python3 .github/scripts/prefix_lcov_paths.py
      - name: Compile Java, merge coverage, and copy real classpaths
        working-directory: backend/uap-server
        run: |
          find build/jacoco-shards -name '*.exec' | tee /tmp/jacoco-execs.txt
          exec_count="$(grep -c '.exec$' /tmp/jacoco-execs.txt || true)"
          if [ "$exec_count" -lt 3 ]; then
            echo "Expected JaCoCo .exec artifacts from all three backend shards, found ${exec_count}."
            exit 1
          fi
          ./gradlew compileJava compileTestJava copySonarLibraries copySonarTestLibraries jacocoMergedReport --no-daemon
          test -f build/reports/jacoco/merged/jacoco.xml
      - name: Require Sonar configuration
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_ORGANIZATION, SONAR_PROJECT_KEY, and SONAR_TOKEN must be configured."
            exit 1
          fi
      # Athlete Readiness V2 baseline: mint sonar.projectVersion=2.0.0 only on the
      # long-lived main analysis. Short-lived develop/PR analyses compare to main
      # for New Code and must not record the release version (Previous version is
      # driven by projectVersion string changes on the analyzed long-lived branch).
      - name: Resolve Sonar project version
        id: sonar-version
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "project_version=2.0.0" >> "$GITHUB_OUTPUT"
            echo "version_arg=-Dsonar.projectVersion=2.0.0" >> "$GITHUB_OUTPUT"
            echo "Sonar projectVersion for this analysis: 2.0.0 (main V2 baseline)"
          else
            echo "project_version=" >> "$GITHUB_OUTPUT"
            echo "version_arg=" >> "$GITHUB_OUTPUT"
            echo "Sonar projectVersion for this analysis: unset (short-lived/integration; do not mint 2.0.0)"
          fi
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: ${{ steps.sonar-java.outputs.java_home }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.java.binaries=backend/uap-server/build/classes/java/main
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.javaExePath=${{ steps.sonar-java.outputs.java_home }}/bin/java
            ${{ steps.sonar-version.outputs.version_arg }}
            -Dsonar.qualitygate.wait=true
      - name: Report Sonar compute-engine error
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "SONAR_TOKEN and SONAR_PROJECT_KEY are required to inspect the compute-engine task."
            exit 1
          fi
          curl -sS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/ce/activity?component=${SONAR_PROJECT_KEY}&ps=3" \
            | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          for task in payload.get("tasks", []):
              print(
                  "status=" + str(task.get("status")),
                  "branch=" + str(task.get("branch")),
                  "type=" + str(task.get("branchType")),
                  "errorType=" + str(task.get("errorType")),
                  "error=" + str(task.get("errorMessage")),
                  sep="\n",
              )
              print("---")
          '
