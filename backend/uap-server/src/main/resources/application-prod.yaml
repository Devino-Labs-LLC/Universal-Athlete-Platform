# Production profile: required secrets/settings have no development defaults.
# Activate with spring.profiles.active=prod (or production).
#
# Required environment variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   UAP_IDENTITY_ACCESS_TOKEN_SECRET
#   UAP_COOKIE_SECURE=true
#   UAP_CORS_ALLOWED_ORIGINS=<comma-separated exact browser origins, no wildcard>
#
# Cookie-auth example (exact origin, no trailing slash):
#   UAP_CORS_ALLOWED_ORIGINS=https://app.example.com
# `up.railway.app` is a public suffix: frontend and API hosts on that suffix are cross-site.
# SameSite=Lax cookies will not be stored/sent on Safari XHR to a different
# Railway hostname. Prefer a custom same-site domain (or same-origin /api proxy).
# Do not set SameSite=None unless cookies.secure=true; Safari ITP may still block
# third-party cookies on default Railway hostnames.
uap:
  identity:
    http:
      cookies:
        secure: ${UAP_COOKIE_SECURE}
        same-site: ${UAP_COOKIE_SAME_SITE:LAX}
      cors:
        allowed-origins: ${UAP_CORS_ALLOWED_ORIGINS}
