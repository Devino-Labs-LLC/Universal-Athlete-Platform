spring:
  application:
    name: uap-server
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Local/dev defaults below are intentionally permissive. Production must activate the
# `prod` (or `production`) Spring profile so application-prod.yaml + IdentityHttpProperties
# production guards reject insecure cookies and localhost CORS origins.
uap:
  identity:
    auth:
      access-token-secret: ${UAP_IDENTITY_ACCESS_TOKEN_SECRET}
      access-token-ttl: ${UAP_IDENTITY_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${UAP_IDENTITY_REFRESH_TOKEN_TTL:30d}
      max-failed-attempts: ${UAP_IDENTITY_MAX_FAILED_ATTEMPTS:5}
      lockout-duration: ${UAP_IDENTITY_LOCKOUT_DURATION:15m}
    http:
      token-delivery: COOKIE
      cookies:
        access-cookie-name: ${UAP_ACCESS_COOKIE_NAME:uap_at}
        refresh-cookie-name: ${UAP_REFRESH_COOKIE_NAME:uap_rt}
        secure: ${UAP_COOKIE_SECURE:false}
        same-site: ${UAP_COOKIE_SAME_SITE:LAX}
        domain: ${UAP_COOKIE_DOMAIN:}
        access-cookie-path: /api
        refresh-cookie-path: /api/v1/identity
      csrf:
        cookie-name: ${UAP_CSRF_COOKIE_NAME:XSRF-TOKEN}
        header-name: ${UAP_CSRF_HEADER_NAME:X-XSRF-TOKEN}
      cors:
        # Default origin matches Vite web (port 3000). Override via UAP_CORS_ALLOWED_ORIGINS
        # (comma-separated) for additional origins such as http://127.0.0.1:3000.
        allowed-origins: ${UAP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
        allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
        allowed-headers: Authorization,Content-Type,X-XSRF-TOKEN,X-Requested-With
        allow-credentials: true
      rate-limit:
        capacity: ${UAP_IDENTITY_RATE_LIMIT_CAPACITY:30}
        window: ${UAP_IDENTITY_RATE_LIMIT_WINDOW:1m}
  integrations:
    # V5 Connected Athlete module. Always present; boots without provider secrets.
    enabled: ${UAP_INTEGRATIONS_ENABLED:true}
    # Centrally owned initial backfill window (days). F2 rejects evidence older than this on ingest.
    backfill-days: ${UAP_INTEGRATIONS_BACKFILL_DAYS:30}
    apple-healthkit:
      # Explicit opt-in. Default off until connector certification (C1).
      enabled: ${UAP_INTEGRATIONS_APPLE_HEALTHKIT_ENABLED:false}
    health-connect:
      # Explicit opt-in. Default off until connector certification (C2).
      enabled: ${UAP_INTEGRATIONS_HEALTH_CONNECT_ENABLED:false}
  billing:
    entitlement-enforcement:
      # Product-edge 402s. Independent of Stripe. Production launch requires an explicit gate.
      enabled: ${UAP_BILLING_ENTITLEMENT_ENFORCEMENT_ENABLED:false}
    organization-capacity-enforcement:
      # Numeric Organization active-athlete bands. Independent of Stripe and entitlement 402s.
      enabled: ${UAP_BILLING_ORGANIZATION_CAPACITY_ENFORCEMENT_ENABLED:false}
    apple:
      # Explicit opt-in. Default off. When true, App Store Connect API credentials and
      # allow-listed Individual Premium product IDs are required (Sandbox only in V4 G2).
      enabled: ${UAP_BILLING_APPLE_ENABLED:false}
      bundle-id: ${UAP_BILLING_APPLE_BUNDLE_ID:}
      key-id: ${UAP_BILLING_APPLE_KEY_ID:}
      issuer-id: ${UAP_BILLING_APPLE_ISSUER_ID:}
      private-key-pem: ${UAP_BILLING_APPLE_PRIVATE_KEY_PEM:}
      environment: ${UAP_BILLING_APPLE_ENVIRONMENT:Sandbox}
      products:
        individual-premium-monthly: ${UAP_BILLING_APPLE_PRODUCT_INDIVIDUAL_PREMIUM_MONTHLY:}
        individual-premium-annual: ${UAP_BILLING_APPLE_PRODUCT_INDIVIDUAL_PREMIUM_ANNUAL:}
    google-play:
      # Explicit opt-in. Default off. When true, Play Developer API service-account JSON and
      # allow-listed Individual Premium product IDs are required (Sandbox / testPurchase only in V4 G3).
      enabled: ${UAP_BILLING_GOOGLE_PLAY_ENABLED:false}
      package-name: ${UAP_BILLING_GOOGLE_PLAY_PACKAGE_NAME:}
      service-account-json: ${UAP_BILLING_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
      environment: ${UAP_BILLING_GOOGLE_PLAY_ENVIRONMENT:Sandbox}
      products:
        individual-premium-monthly: ${UAP_BILLING_GOOGLE_PLAY_PRODUCT_INDIVIDUAL_PREMIUM_MONTHLY:}
        individual-premium-annual: ${UAP_BILLING_GOOGLE_PLAY_PRODUCT_INDIVIDUAL_PREMIUM_ANNUAL:}
    stripe:
      # Explicit opt-in. Tests and default local boot leave Stripe disabled.
      # When true, a test-mode key, all Price IDs, and return URLs are required.
      # Live keys (sk_live_ / rk_live_) are rejected — Slice B is sandbox-only.
      enabled: ${UAP_BILLING_STRIPE_ENABLED:false}
      secret-key: ${UAP_BILLING_STRIPE_SECRET_KEY:}
      webhook-secret: ${UAP_BILLING_STRIPE_WEBHOOK_SECRET:}
      success-url: ${UAP_BILLING_STRIPE_SUCCESS_URL:}
      cancel-url: ${UAP_BILLING_STRIPE_CANCEL_URL:}
      individual-success-url: ${UAP_BILLING_STRIPE_INDIVIDUAL_SUCCESS_URL:}
      individual-cancel-url: ${UAP_BILLING_STRIPE_INDIVIDUAL_CANCEL_URL:}
      portal-configuration-id: ${UAP_BILLING_STRIPE_PORTAL_CONFIGURATION_ID:}
      portal-return-url: ${UAP_BILLING_STRIPE_PORTAL_RETURN_URL:}
      individual-portal-return-url: ${UAP_BILLING_STRIPE_INDIVIDUAL_PORTAL_RETURN_URL:}
      prices:
        org-band-25-monthly: ${UAP_BILLING_STRIPE_PRICE_ORG_BAND_25_MONTHLY:}
        org-band-25-annual: ${UAP_BILLING_STRIPE_PRICE_ORG_BAND_25_ANNUAL:}
        org-band-75-monthly: ${UAP_BILLING_STRIPE_PRICE_ORG_BAND_75_MONTHLY:}
        org-band-75-annual: ${UAP_BILLING_STRIPE_PRICE_ORG_BAND_75_ANNUAL:}
        org-band-250-monthly: ${UAP_BILLING_STRIPE_PRICE_ORG_BAND_250_MONTHLY:}
        org-band-250-annual: ${UAP_BILLING_STRIPE_PRICE_ORG_BAND_250_ANNUAL:}
        individual-premium-monthly: ${UAP_BILLING_STRIPE_PRICE_INDIVIDUAL_PREMIUM_MONTHLY:}
        individual-premium-annual: ${UAP_BILLING_STRIPE_PRICE_INDIVIDUAL_PREMIUM_ANNUAL:}
