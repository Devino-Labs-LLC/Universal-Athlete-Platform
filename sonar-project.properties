# Path configuration only. Organization, project key, and token come from CI.
sonar.projectName=Universal Athlete Platform
sonar.sources=backend/uap-server/src/main/java,apps/web/src,apps/mobile/src
sonar.tests=backend/uap-server/src/test,apps/web/src,apps/mobile/__tests__
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/coverage/**,**/android/**,**/ios/**
sonar.sourceEncoding=UTF-8
sonar.coverage.jacoco.xmlReportPaths=backend/uap-server/build/reports/jacoco/merged/jacoco.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info
sonar.java.test.binaries=backend/uap-server/build/classes/java/test
sonar.java.libraries=backend/uap-server/build/sonar/libs/*.jar
sonar.java.test.libraries=backend/uap-server/build/classes/java/main,backend/uap-server/build/sonar/test-libs/*.jar
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,apps/mobile/tsconfig.json
