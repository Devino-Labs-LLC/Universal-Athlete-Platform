plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devinolabs'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.0'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Integration suites spin many Spring + Testcontainers contexts; default heap OOMs near full suite.
	maxHeapSize = '2g'
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = false
		csv.required = false
	}
}

// Merge per-shard JaCoCo .exec files collected in CI. Does not re-run tests.
tasks.register('jacocoMergedReport', JacocoReport) {
	dependsOn tasks.named('compileJava')
	sourceDirectories.from(sourceSets.main.allSource.srcDirs)
	classDirectories.from(sourceSets.main.output)
	executionData.from({
		fileTree(layout.buildDirectory.get().dir('jacoco-shards').asFile).include('**/*.exec')
	})
	onlyIf {
		def shardDir = layout.buildDirectory.get().dir('jacoco-shards').asFile
		shardDir.exists() && !fileTree(shardDir).include('**/*.exec').isEmpty()
	}
	reports {
		xml.required = true
		xml.outputLocation = layout.buildDirectory.file('reports/jacoco/merged/jacoco.xml')
		html.required = false
		csv.required = false
	}
}

tasks.register('copySonarLibraries', Copy) {
	from configurations.named('runtimeClasspath')
	into layout.buildDirectory.dir('sonar/libs')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('copySonarTestLibraries', Copy) {
	from configurations.named('testRuntimeClasspath')
	into layout.buildDirectory.dir('sonar/test-libs')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
