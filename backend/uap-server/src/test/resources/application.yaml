uap:
  identity:
    auth:
      access-token-secret: test-access-token-secret-value-32chars-min
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      max-failed-attempts: 5
      lockout-duration: 15m
    http:
      token-delivery: COOKIE
      cookies:
        secure: false
        same-site: LAX
      cors:
        allowed-origins:
          - http://localhost:3000
          - http://127.0.0.1:3000
        allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      rate-limit:
        capacity: 1000
        window: 1m
